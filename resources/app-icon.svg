<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#0d1a12"/>
      <stop offset="0.55" stop-color="#070b0c"/>
      <stop offset="1" stop-color="#05070a"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cff4a"/>
      <stop offset="1" stop-color="#12d604"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#151a20" stroke-width="104"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#1d232b" stroke-width="104" stroke-dasharray="2 0" opacity="0.6"/>
  <!-- Bogen von 12 Uhr im Uhrzeigersinn bis ca. 8 Uhr (wie public/icon.svg) -->
  <g transform="rotate(-90 512 512)">
    <circle cx="512" cy="512" r="300" fill="none" stroke="#16ec06" stroke-width="104" stroke-linecap="round"
      stroke-dasharray="1256.6 1884.96" filter="url(#glow)" opacity="0.75"/>
    <circle cx="512" cy="512" r="300" fill="none" stroke="#16ec06" stroke-width="104" stroke-linecap="round"
      stroke-dasharray="1256.6 1884.96" filter="url(#glow2)" opacity="0.6"/>
    <circle cx="512" cy="512" r="300" fill="none" stroke="url(#arc)" stroke-width="104" stroke-linecap="round"
      stroke-dasharray="1256.6 1884.96"/>
  </g>
</svg>
