# Baut die native iOS-App (unsigniert) und veröffentlicht sie als Release "ios-latest".
# Die IPA wird auf dem iPhone von SideStore mit der eigenen (kostenlosen) Apple-ID signiert – siehe docs/IOS.md.
name: iOS-Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  # Pull Requests: nur bauen und prüfen, kein Release.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

# Standard: nur lesen. Nur der Release-Job bekommt Schreibrechte.
permissions:
  contents: read

# Läufe auf main werden nie mitten im Release abgebrochen (ein neuer wartet); bei PRs ersetzt ein neuer Push den alten Lauf.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IPA_NAME: WhoopPlus.ipa

jobs:
  build:
    name: IPA bauen
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      marketing: ${{ steps.ver.outputs.marketing }}
      build: ${{ steps.ver.outputs.build }}
      artifact: ${{ steps.ver.outputs.artifact }}
    steps:
      - name: Code holen
        uses: actions/checkout@v6

      - name: Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Tests
        run: npm test

      - name: Web-Oberfläche bauen
        run: npm run build

      - name: Capacitor-Sync (Web-Dateien + Swift-Pakete)
        run: npx cap sync ios

      - name: Swift-Paket-Cache
        uses: actions/cache@v5
        with:
          path: spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Versionsnummern
        id: ver
        run: |
          echo "marketing=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "artifact=WhoopPlus-$(node -p "require('./package.json').version")-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      - name: Xcode-Build (unsigniert, Gerät)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath spm \
            -quiet \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPA packen
        run: |
          APP=build/Build/Products/Release-iphoneos/App.app
          test -f "$APP/public/index.html" || { echo "::error::Web-Dateien fehlen in App.app"; exit 1; }
          echo "CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          echo "CFBundleShortVersionString: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../$IPA_NAME" Payload)
          ls -lh "$IPA_NAME"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.ver.outputs.artifact }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release "ios-latest" aktualisieren
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ios-latest
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MARKETING: ${{ needs.build.outputs.marketing }}
      BUILD: ${{ needs.build.outputs.build }}
    steps:
      - name: Code holen (für das Tag)
        uses: actions/checkout@v6

      - name: IPA aus dem Build-Job holen
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Tag verschieben und Release aktualisieren (ohne Lücke)
        run: |
          test -f "$IPA_NAME"
          TITLE="Whoop Plus iOS $MARKETING ($BUILD)"
          NOTES="Automatischer Build $MARKETING ($BUILD) von ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC').

          Unsigniert – Installation und Aktualisierung über SideStore, siehe docs/IOS.md."
          # Tag auf den gebauten Commit setzen (ein bestehendes Release folgt dem Tag).
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$IPA_NAME" --clobber
            gh release edit "$RELEASE_TAG" --prerelease --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" "$IPA_NAME" --verify-tag --prerelease --title "$TITLE" --notes "$NOTES"
          fi
