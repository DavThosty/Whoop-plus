# Portainer stack for Whoop-plus (deploy "from Git repository").
# The container publishes NO ports to the host: Nginx Proxy Manager reaches it over the shared
# Docker network at http://whoop-plus:8080 and terminates TLS for https://whoop.steiner-kn.de.
services:
  whoop-plus:
    build:
      context: .
      dockerfile: Dockerfile
    image: whoop-plus:latest
    # Always build from the checked-out repo on (re)deploy; never try to pull this image.
    pull_policy: build
    container_name: whoop-plus
    restart: unless-stopped
    environment:
      RP_ID: ${RP_ID:-whoop.steiner-kn.de}
      ORIGIN: ${ORIGIN:-https://whoop.steiner-kn.de}
      PORT: ${PORT:-8080}
      DATA_DIR: /data
      SESSION_DAYS: ${SESSION_DAYS:-30}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Optional: fixed setup code instead of a random one from the log.
      SETUP_CODE: ${SETUP_CODE:-}
      # Set to 1 ONLY for one deploy to wipe all passkeys and sessions, then remove it again.
      RESET_AUTH: ${RESET_AUTH:-}
    volumes:
      - whoop-data:/data
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  whoop-data:

networks:
  proxy:
    external: true
    # Name of Nginx Proxy Manager's Docker network (see docs/DEPLOY.md, step 3).
    name: ${PROXY_NETWORK:-npm_default}
